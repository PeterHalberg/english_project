<!DOCTYPE html>
<html>
  <head>
    <title>Main</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class = "header"><h1>Lessons about labor from George Orwell "Animal farm"</h1></div>
    <div class = "main">
      <div class = "howerpoint">1</div>
      <div class = "text">aaa</div>
      <div class = "howerpoint">2</div>
      <div class = "text">txt</div>
      <div class = "howerpoint">3</div>
      <div class = "text">txt</div>
      <div class = "howerpoint">4</div>
      <div class = "text">txt</div>
      <div class = "howerpoint">5</div>
      <div class = "text">txt</div>
      <div class = "howerpoint">6</div>
      <div class = "text">txt</div>
      <div class = "howerpoint">7</div>
      <div class = "text">txt</div>
      <div class = "howerpoint">8</div>
      <div class = "text">txt</div>
      <div class = "howerpoint">9</div>
      <div class = "text">txt</div>
    </div>
    <script>
  const points = document.querySelectorAll('.howerpoint');

  points.forEach(point => {
    // Находим соседа справа (тот самый .text)
    const content = point.nextElementSibling;

    point.addEventListener('mouseenter', () => {
      if (content) content.classList.add('visible');
    });

    point.addEventListener('mouseleave', () => {
      if (content) content.classList.remove('visible');
    });
  });
</script>
  </body>
</html>
